name: Build OpenWrt 25.12.6 (Beeline SBT+ SPI 64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom files
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools rsync unzip zlib1g-dev file wget swig

      - name: Clone OpenWrt v25.12.6
        run: |
          HOST="github.com"
          ORG="openwrt"
          REPO="openwrt.git"
          git clone --depth 1 -b v25.12.6 "https://${HOST}/${ORG}/${REPO}" openwrt

      - name: Clone custom LuCI apps (gSpotx2f)
        run: |
          HOST="github.com"
          DEV="gSpotx2f"
          mkdir -p openwrt/package/custom
          git clone --depth 1 "https://${HOST}/${DEV}/luci-app-disks-info.git" openwrt/package/custom/luci-app-disks-info
          git clone --depth 1 "https://${HOST}/${DEV}/luci-app-cpu-status.git" openwrt/package/custom/luci-app-cpu-status
          git clone --depth 1 "https://${HOST}/${DEV}/luci-app-temp-status.git" openwrt/package/custom/luci-app-temp-status
          git clone --depth 1 "https://${HOST}/fantastic-packages/fantastic-keyring.git" openwrt/package/custom/fantastic-keyring
          
      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject custom DTS, device profile and fantastic-packages repo
        run: |
          cp -v target/linux/ramips/dts/mt7621_beeline_sbtplus.dtsi openwrt/target/linux/ramips/dts/
          cp -v target/linux/ramips/dts/mt7621_beeline_sbtplusspi.dts openwrt/target/linux/ramips/dts/
          echo "" >> openwrt/target/linux/ramips/image/mt7621.mk
          cat target/linux/ramips/image/beeline_sbtplusspi.mk >> openwrt/target/linux/ramips/image/mt7621.mk

          mkdir -p openwrt/files/etc/apk/repositories.d
          mkdir -p openwrt/files/etc/apk/keys
          FP_HOST="fantastic-packages.github.io"
          FP_PATH="releases/25.12/packages/mipsel_24kc"
          cat << EOF > openwrt/files/etc/apk/repositories.d/customfeeds.list
          https://${FP_HOST}/${FP_PATH}/packages/packages.adb
          https://${FP_HOST}/${FP_PATH}/luci/packages.adb
          https://${FP_HOST}/${FP_PATH}/special/packages.adb
          EOF
          mkdir -p openwrt/files/etc/uci-defaults
          cat << 'EOF' > openwrt/files/etc/uci-defaults/99-wifi-setup
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio0.country='RU'
          uci set wireless.default_radio0.disabled='0'
          uci set wireless.default_radio0.ssid='Tplink-190'
          uci set wireless.default_radio0.encryption='psk2'
          uci set wireless.default_radio0.key='460EE236'

          uci set wireless.radio1.disabled='0'
          uci set wireless.radio1.country='RU'
          uci set wireless.default_radio1.disabled='0'
          uci set wireless.default_radio1.ssid='Tplink-190 5G'
          uci set wireless.default_radio1.encryption='psk2'
          uci set wireless.default_radio1.key='460EE236'

          uci commit wireless
          wifi reload
          exit 0
          EOF
          chmod +x openwrt/files/etc/uci-defaults/99-wifi-setup
      
      - name: Apply official config.buildinfo + custom .config
        working-directory: openwrt
        run: |
          DL_HOST="downloads.openwrt.org"
          CFG_PATH="releases/25.12.6/targets/ramips/mt7621/config.buildinfo"
          wget -O .config "https://${DL_HOST}/${CFG_PATH}"
          sed -i 's/^CONFIG_TARGET_ramips_mt7621_DEVICE_.*=y/# & is not set/' .config
          sed -i '/luci-i18n-/d' .config
          echo "CONFIG_PACKAGE_fantastic-keyring=y" >> .config
          cat ../.config >> .config
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \;

      - name: Compile OpenWrt 25.12.6
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12.6-Beeline-SBTPlus-SPI64
          path: openwrt/bin/targets/ramips/mt7621/*



